name: CI

on:
  workflow_dispatch:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        # actions/setup-python@v5.6.0
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.x"

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ipmitool libargtable2-0
          python -m pip install pytest cryptography

      - name: Install Dell RACADM
        run: |
          sudo apt-get install -y curl tar libargtable2-0 pciutils
          curl -fsSL -A 'Mozilla/5.0' -o /tmp/idrac-tools.tar.gz \
            https://dl.dell.com/FOLDER12638439M/1/Dell-iDRACTools-Web-LX-11.3.0.0-795_A00.tar.gz
          tar -xzf /tmp/idrac-tools.tar.gz -C /tmp
          cd /tmp/iDRACTools/racadm/UBUNTU22/x86_64
          sudo dpkg --unpack --force-all srvadmin-hapi*.deb srvadmin-idracadm7*.deb srvadmin-idracadm8*.deb
          systemctl_path=$(command -v systemctl)
          sudo mv "$systemctl_path" "$systemctl_path.real"
          trap 'sudo mv "$systemctl_path.real" "$systemctl_path"' EXIT
          printf '#!/bin/sh\nexit 0\n' | sudo tee "$systemctl_path" >/dev/null
          sudo chmod +x "$systemctl_path"
          sudo DEBIAN_FRONTEND=noninteractive dpkg --configure -a --force-confold
          sudo mv "$systemctl_path.real" "$systemctl_path"
          trap - EXIT
          command -v racadm

      - name: Run tests
        run: python -m pytest -q
